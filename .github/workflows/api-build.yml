# Build pipeline for the Payments API component.
#
# The api-build and mutation-testing jobs run in parallel but contribute to a
# SINGLE attestation: `init --remote-state` keeps the state on the server keyed
# by an attestation-id, so any job holding the id can add evidence to it.

name: Backend API Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # OIDC token Chainloop uses to identify the org, so no CHAINLOOP_TOKEN is
  # needed below.
  id-token: write

jobs:
  # Also collects the runner context, so it must run before anything it
  # describes.
  attestation-init:
    name: Open attestation
    runs-on: ubuntu-latest
    outputs:
      attestation-id: ${{ steps.init.outputs.attestation-id }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s
      - name: Initialize attestation
        id: init
        env:
          # Lets the runner-context collector verify the commit and its signature
          # through the GitHub API, which source-commit reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without pipefail the pipeline reports jq's status, so a failed init
          # would "succeed" with an empty id and blame the downstream `add`.
          set -o pipefail
          # No --version: the CLI picks up projectVersion from .chainloop.yml, so
          # this build lands in the same in-flight version as the mobile client
          # and the eventual release.
          id=$(chainloop attestation init --remote-state \
            --project retail-banking-app --workflow payments-api-build -o json | jq -r .attestationID)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::attestation init returned no attestation id"
            exit 1
          fi
          echo "attestation-id=${id}" >> "$GITHUB_OUTPUT"
          echo "Attestation ${id}"

  api-build:
    name: Payments API
    needs: attestation-init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api
    strategy:
      matrix:
        java: [ '17' ]

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history, for SonarQube analysis relevancy
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarQube packages
        if: matrix.java == '17'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Only for additional matrix entries, which do not feed Sonar.
      - name: Build with Maven Wrapper
        if: matrix.java != '17'
        run: ./mvnw -B verify
      # One `verify` build feeds both Sonar and JaCoCo, whose `report` goal is
      # already bound to `prepare-package`.
      - name: Build and analyze
        if: matrix.java == '17'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # The project key predates the payments-api rename and cannot change from
        # here: the token has no Create Projects permission. Only the display
        # name follows the rename.
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=chainloop-dev_java-component-demo_e657147d-321b-4e10-bc1d-c06bb577d2df -Dsonar.projectName='payments-api'

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      - name: Attest application JAR
        run: |
          jar=$(ls target/*.jar)   # Does not match Boot's leftover .jar.original
          chainloop attestation add --name app-binary --kind ARTIFACT \
            --value "$jar" --attestation-id "$ATTESTATION_ID"

      - name: Attest coverage report
        run: |
          chainloop attestation add --name coverage-report --kind JACOCO_XML \
            --value target/site/jacoco/jacoco.xml --attestation-id "$ATTESTATION_ID"

      # The sonar goal only uploads; the server processes the report in a
      # background task. Without waiting, the transform below would attest the
      # previous commit's issues, or an empty result that reads as "clean".
      # Polled rather than -Dsonar.qualitygate.wait=true, which would also let a
      # red Sonar gate fail the build — gating is the attestation policy's job.
      - name: Wait for SonarQube analysis
        if: matrix.java == '17'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          task_url=$(sed -n 's/^ceTaskUrl=//p' target/sonar/report-task.txt)
          for _ in $(seq 1 60); do
            status=$(curl -sf -u "${SONAR_TOKEN}:" "$task_url" | jq -r .task.status)
            echo "Compute Engine task: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CANCELED) echo "::error::SonarQube analysis $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::timed out waiting for SonarQube analysis"; exit 1

      # Pulls the issues back out of the Search API as SARIF. --branch main is
      # required by the transform's validation but is a no-op on Community Build.
      - name: Attest SonarQube report
        if: matrix.java == '17'
        env:
          # The transform reads these names; the secrets are named for the Maven
          # plugin, hence the mapping.
          SONARQUBE_URL: ${{ secrets.SONAR_HOST_URL }}
          SONARQUBE_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chainloop transform sonarqube \
            --project chainloop-dev_java-component-demo_e657147d-321b-4e10-bc1d-c06bb577d2df \
            --branch main --output-file sq.sarif
          chainloop attestation add --name sast-report --kind SARIF \
            --value sq.sarif --attestation-id "$ATTESTATION_ID"

  # Separate job: a full PIT run takes far longer than the test suite and must
  # not hold up the regular build.
  mutation-testing:
    name: Mutation testing (PIT)

    needs: attestation-init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run PIT mutation coverage
        run: ./mvnw -B -P mutation verify

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # Not published as a build artifact: the attested copy is the retrievable
      # one, and a run artifact would expire in 90 days claiming to be the same
      # evidence.
      - name: Attest mutation report
        run: |
          chainloop attestation add --name mutation-report --kind PITEST_XML \
            --value target/pit-reports/mutations.xml --attestation-id "$ATTESTATION_ID"

  # `success()`/`failure()` describe a job's own steps, so upstream results are
  # read from the needs context instead.
  attestation-push:
    name: Close attestation
    needs: [ attestation-init, api-build, mutation-testing ]
    # Nothing to close if init produced no id, and `reset` would fail on an
    # empty --attestation-id.
    if: always() && needs.attestation-init.result == 'success'
    runs-on: ubuntu-latest

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}

    steps:
      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # A policy violation makes this exit non-zero, which is what lets a gate
      # block the pipeline rather than just annotate it.
      - name: Push attestation
        id: push
        if: needs.api-build.result == 'success' && needs.mutation-testing.result == 'success'
        run: chainloop attestation push --attestation-id "$ATTESTATION_ID"

      # Catch-all rather than one step per outcome: a needs result can also be
      # `skipped`, which no failure/cancelled condition matches, leaving the
      # remote attestation open forever. `init --replace` applies to local state
      # only, so nothing but a manual reset would clear it.
      - name: Reset attestation if it was not pushed
        if: always() && steps.push.outcome != 'success'
        run: |
          trigger=failure
          if [ "${{ needs.api-build.result }}" = "cancelled" ] \
            || [ "${{ needs.mutation-testing.result }}" = "cancelled" ]; then
            trigger=cancellation
          fi
          chainloop attestation reset --trigger "$trigger" --attestation-id "$ATTESTATION_ID"
