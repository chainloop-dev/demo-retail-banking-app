# Pipeline for the mobile client component.
#
# Placeholder component: there are no Android sources here and no scanner runs in
# CI, so two of the steps below are substitutions and labelled as such. See
# mobile-client/README.md for what is real and what is not.
name: Mobile Client Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # OIDC token Chainloop uses to identify the org, so no CHAINLOOP_TOKEN is
  # needed below.
  id-token: write

env:
  # Pre-built binary, and the path Gradle would have written the real one to.
  PREBUILT_APK: mobile-client/DecodeConfigSampleAPI-Kotlin.apk
  APK: mobile-client/build/outputs/apk/release/mobile-banking-release.apk
  REPORT: mobile-client/build/reports/oversecured/mobile-banking-oversecured.json
  # Oversecured SampleApp 3.4.0, already scanned in the tenant. Deliberately not
  # the same application as the APK above.
  OVERSECURED_APP_ID: 6c69e813-32f5-49f1-bf53-568d63fc309d
  OVERSECURED_SCAN_ID: e62f4c1b-8ca7-4c7a-8ca8-7b7fd33a6b14
  OVERSECURED_CLI: '@oversecured/cli@0.1.0-beta.4'

jobs:
  build-and-attest:
    name: Mobile client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s 

      # No --version: the CLI picks up projectVersion from .chainloop.yml, so
      # this build lands in the same in-flight version as the payments API and
      # the eventual release.
      - name: Initialize attestation
        id: init
        env:
          # Lets the runner-context collector verify the commit and its signature
          # through the GitHub API, which source-commit reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chainloop attestation init --project retail-banking-app --workflow mobile-client-build

      # SUBSTITUTION 1 of 2: a real pipeline replaces this with
      # `./gradlew assembleRelease` and changes nothing else.
      - name: Stage release APK (stands in for the Android build)
        run: |
          mkdir -p "$(dirname "$APK")"
          cp "$PREBUILT_APK" "$APK"
          sha256sum "$APK"

      # SUBSTITUTION 2 of 2: Oversecured is cloud-only and metered, so the scan
      # ran once out of band rather than per CI run.
      - name: Scan APK (performed out of band in the Oversecured tenant)
        run: |
          echo "No scan runs in CI. Oversecured scan ${OVERSECURED_SCAN_ID}"
          echo "of app ${OVERSECURED_APP_ID} already covers this component;"
          echo "the next step fetches its report."

      # Real: fetched live on every run. --output pins a stable filename;
      # otherwise the CLI derives a timestamped one.
      - name: Fetch Oversecured report
        env:
          OVERSECURED_API_TOKEN: ${{ secrets.OVERSECURED_API_TOKEN }}
        run: |
          mkdir -p "$(dirname "$REPORT")"
          npx -y "$OVERSECURED_CLI" report "$OVERSECURED_SCAN_ID" \
            --app "$OVERSECURED_APP_ID" \
            --format json \
            --output "$REPORT"

      # Real from here on. Both materials land in one signed attestation — that
      # statement, not any digest inside the report, binds the binary to its scan.
      - name: Attest APK
        run: chainloop attestation add --name app-binary --kind ARTIFACT --value "$APK"

      - name: Attest Oversecured report
        run: chainloop attestation add --name sast-report --kind OVERSECURED_JSON --value "$REPORT"

      - name: Push attestation
        if: success()
        run: chainloop attestation push

      # Both resets are gated on init: a bare failure()/cancelled() also fires
      # when checkout, Node setup or the CLI install failed, where there is no
      # attestation to reset and no `chainloop` binary to do it with.
      - name: Reset attestation on failure
        if: failure() && steps.init.outcome == 'success'
        run: chainloop attestation reset

      - name: Reset attestation on cancellation
        if: cancelled() && steps.init.outcome == 'success'
        run: chainloop attestation reset --trigger cancellation
