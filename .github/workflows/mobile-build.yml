# Pipeline for the mobile client component.
#
# The mobile client is a placeholder: there are no Android sources in this
# repository and no scanner runs here. Two of the four steps below are therefore
# substitutions rather than the real thing, and they are labelled as such.
# See mobile-client/README.md for what is real and what is not, and why.
name: Mobile Client Build

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-client/**'
      - '.github/workflows/mobile-build.yml'
  # Manual runs, e.g. to re-attest after a contract change without a code push.
  workflow_dispatch:

permissions:
  contents: read
  # Lets the workflow request an OIDC token that Chainloop uses to identify the
  # org, so no CHAINLOOP_TOKEN is needed anywhere below.
  id-token: write

env:
  # The pre-built binary standing in for a Gradle build output, and the path
  # Gradle would have written the real one to.
  PREBUILT_APK: mobile-client/DecodeConfigSampleAPI-Kotlin.apk
  APK: mobile-client/build/outputs/apk/release/mobile-banking-release.apk
  REPORT: mobile-client/build/reports/oversecured/mobile-banking-oversecured.json
  # Oversecured SampleApp 3.4.0 and the scan already completed against it in the
  # tenant. Deliberately not the same application as the APK above.
  OVERSECURED_APP_ID: 6c69e813-32f5-49f1-bf53-568d63fc309d
  OVERSECURED_SCAN_ID: e62f4c1b-8ca7-4c7a-8ca8-7b7fd33a6b14
  OVERSECURED_CLI: '@oversecured/cli@0.1.0-beta.4'

jobs:
  build-and-attest:
    name: Mobile client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s 

      # No --version: the CLI walks up for .chainloop.yml and uses its
      # projectVersion, so this build lands in the same in-flight version as the
      # payments API and the eventual release. See release.yml.
      - name: Initialize attestation
        id: init
        run: chainloop attestation init --project retail-banking-app --workflow mobile-client-build

      # SUBSTITUTION 1 of 2: no Android sources exist, so nothing is compiled.
      # A real pipeline replaces this step with `./gradlew assembleRelease` and
      # changes nothing else in this job.
      - name: Stage release APK (stands in for the Android build)
        run: |
          mkdir -p "$(dirname "$APK")"
          cp "$PREBUILT_APK" "$APK"
          sha256sum "$APK"

      # SUBSTITUTION 2 of 2: Oversecured is cloud-only and metered, so the scan
      # is performed once out of band in the tenant rather than per CI run.
      - name: Scan APK (performed out of band in the Oversecured tenant)
        run: |
          echo "No scan runs in CI. Oversecured scan ${OVERSECURED_SCAN_ID}"
          echo "of app ${OVERSECURED_APP_ID} already covers this component;"
          echo "the next step fetches its report."

      # Real: the report is fetched live from Oversecured's API on every run.
      # --output pins a stable filename; without it the CLI derives a
      # timestamped one that the following steps would have to glob for.
      - name: Fetch Oversecured report
        env:
          OVERSECURED_API_TOKEN: ${{ secrets.OVERSECURED_API_TOKEN }}
        run: |
          mkdir -p "$(dirname "$REPORT")"
          npx -y "$OVERSECURED_CLI" report "$OVERSECURED_SCAN_ID" \
            --app "$OVERSECURED_APP_ID" \
            --format json \
            --output "$REPORT"

      # Real: from here on this is exactly what a customer's pipeline does.
      # Both materials land in one signed attestation — that statement, not any
      # digest inside the report, is what binds the binary to its scan.
      - name: Attest APK
        run: chainloop attestation add --name app-binary --kind ARTIFACT --value "$APK"

      - name: Attest Oversecured report
        run: chainloop attestation add --name sast-report --kind OVERSECURED_JSON --value "$REPORT"

      - name: Push attestation
        if: success()
        run: chainloop attestation push

      # Both resets are gated on init having succeeded. A bare failure()/cancelled()
      # also fires when checkout, Node setup or the CLI install failed — cases with
      # no attestation to reset, and in the install case no `chainloop` binary
      # either, so the reset would exit non-zero on top of the real failure and
      # bury it.
      - name: Reset attestation on failure
        if: failure() && steps.init.outcome == 'success'
        run: chainloop attestation reset

      - name: Reset attestation on cancellation
        if: cancelled() && steps.init.outcome == 'success'
        run: chainloop attestation reset --trigger cancellation

      # Mirrors the PIT report upload in api-build.yml. upload-artifact always
      # zips, so the download is mobile-evidence.zip; the attestation above
      # consumed the raw files rather than round-tripping through the archive.
      - name: Upload APK and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-evidence
          path: |
            mobile-client/build/outputs/apk/release/
            mobile-client/build/reports/oversecured/
          if-no-files-found: warn
