# Build pipeline for the Payments API component, BEFORE Chainloop.
#
# Reference copy — see before/README.md. Nothing in this directory is picked up
# by GitHub Actions.
#
# Two independent jobs, each ending in an upload-artifact step: the build
# produces a JAR, a coverage report and a SARIF-shaped view of the Sonar
# findings, mutation testing produces a PIT report, and each lands wherever its
# own tool puts it. Nothing correlates them, and nothing blocks on them.

name: Backend API Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    name: Payments API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history, for SonarQube analysis relevancy
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarQube packages
        if: matrix.java == '17'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Only for additional matrix entries, which do not feed Sonar.
      - name: Build with Maven Wrapper
        if: matrix.java != '17'
        run: ./mvnw -B verify
      # One `verify` build feeds both Sonar and JaCoCo, whose `report` goal is
      # already bound to `prepare-package`.
      #
      # The findings are uploaded and then stay on the Sonar server; reading
      # them back out means opening the dashboard.
      - name: Build and analyze
        if: matrix.java == '17'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=chainloop-dev_java-component-demo_e657147d-321b-4e10-bc1d-c06bb577d2df -Dsonar.projectName='payments-api'

      # 90-day retention, and no link from here to the Sonar analysis of the
      # same commit.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: payments-api-build
          path: |
            payments-api/target/*.jar
            payments-api/target/site/jacoco/jacoco.xml
          if-no-files-found: error

  # Separate job: a full PIT run takes far longer than the test suite and must
  # not hold up the regular build.
  mutation-testing:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run PIT mutation coverage
        run: ./mvnw -B -P mutation verify

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: payments-api-mutation-report
          path: payments-api/target/pit-reports/mutations.xml
          if-no-files-found: error
