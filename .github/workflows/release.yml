name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attest, e.g. v2026.9'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      - name: Initialize gate attestation
        id: init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chainloop attestation init --project retail-banking-app --workflow release-gate

      - name: Push gate attestation
        id: push
        run: chainloop attestation push

      - name: Reset attestation if it was not pushed
        if: always() && steps.init.outcome == 'success' && steps.push.outcome != 'success'
        run: |
          trigger=failure
          if [ "${{ job.status }}" = "cancelled" ]; then
            trigger=cancellation
          fi
          chainloop attestation reset --trigger "$trigger"

  integration-tests:
    name: Integration tests
    needs: release-gate
    runs-on: ubuntu-latest
    outputs:
      attestation-id: ${{ steps.init.outputs.attestation-id }}
      tag: ${{ steps.tag.outputs.tag }}
      current-version: ${{ steps.project_version.outputs.current_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::could not resolve a release tag"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Read in-flight project version
        id: project_version
        run: |
          current_version="$(awk '/^projectVersion:/ {print $2}' .chainloop.yml)"
          if [ -z "$current_version" ]; then
            echo "::error::no projectVersion in .chainloop.yml"
            exit 1
          fi
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${current_version} as ${{ steps.tag.outputs.tag }}"

      - name: Initialize release attestation
        id: init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          id=$(chainloop attestation init --remote-state --release \
            --project retail-banking-app --workflow release -o json | jq -r .attestationID)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::attestation init returned no attestation id"
            exit 1
          fi
          echo "attestation-id=${id}" >> "$GITHUB_OUTPUT"
          echo "Attestation ${id}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run the cross-component integration suite
        working-directory: payments-api
        run: ./mvnw -B -P integration verify

      - name: Package the Failsafe reports
        working-directory: payments-api
        run: zip -q -j failsafe-reports.zip target/failsafe-reports/*.xml

      - name: Attest integration test report
        working-directory: payments-api
        env:
          ATTESTATION_ID: ${{ steps.init.outputs.attestation-id }}
        run: |
          chainloop attestation add --name integration-report --kind JUNIT_XML \
            --value failsafe-reports.zip --attestation-id "$ATTESTATION_ID"

  release:
    name: Release attestation
    needs: [ release-gate, integration-tests ]
    if: always() && needs.integration-tests.outputs.attestation-id != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write

    env:
      ATTESTATION_ID: ${{ needs.integration-tests.outputs.attestation-id }}
      RELEASE_TAG: ${{ needs.integration-tests.outputs.tag }}
      CURRENT_VERSION: ${{ needs.integration-tests.outputs.current-version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/payments-api:${{ needs.integration-tests.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      - name: Set up JDK 17
        if: needs.integration-tests.result == 'success'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log in to GHCR
        if: needs.integration-tests.result == 'success'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the container image
        if: needs.integration-tests.result == 'success'
        working-directory: payments-api
        run: |
          ./mvnw -B spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName="$IMAGE" \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username='${{ github.actor }}' \
            -Ddocker.publishRegistry.password='${{ secrets.GITHUB_TOKEN }}'

      - name: Attest container image
        if: needs.integration-tests.result == 'success'
        run: |
          chainloop attestation add --name container-image --kind CONTAINER_IMAGE \
            --value "$IMAGE" --attestation-id "$ATTESTATION_ID"

      - name: Push attestation
        id: push
        if: needs.integration-tests.result == 'success'
        run: chainloop attestation push --attestation-id "$ATTESTATION_ID"

      - name: Rename project version to the release tag
        if: steps.push.outcome == 'success'
        env:
          CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
        run: |
          chainloop project version update --project retail-banking-app \
            --name "$CURRENT_VERSION" --new-name "$RELEASE_TAG"

      - name: Bump project version for the next cycle
        if: steps.push.outcome == 'success'
        run: .github/workflows/utils/bump-project-version.sh "$RELEASE_TAG"

      - name: Open the bump pull request
        if: steps.push.outcome == 'success'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore(chainloop): bump projectVersion to ${{ env.RELEASE_TAG }}+next"
          signoff: true
          base: main
          branch: chainloop/bump-project-version
          title: "chore(chainloop): open the cycle after ${{ env.RELEASE_TAG }}"
          body: |
            `${{ env.RELEASE_TAG }}` is released and its project version
            renamed. This points `.chainloop.yml` at the next cycle, so builds
            of both components attest under `${{ env.RELEASE_TAG }}+next`.

            Until this merges, builds keep attesting under
            `${{ env.CURRENT_VERSION }}`, which is now the released version.
          labels: automated

      - name: Reset attestation if it was not pushed
        if: always() && steps.push.outcome != 'success'
        run: |
          trigger=failure
          if [ "${{ needs.integration-tests.result }}" = "cancelled" ] \
            || [ "${{ job.status }}" = "cancelled" ]; then
            trigger=cancellation
          fi
          chainloop attestation reset --trigger "$trigger" --attestation-id "$ATTESTATION_ID"
