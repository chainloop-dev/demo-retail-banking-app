# Release pipeline for the retail-banking-app product.
#
# Third workflow of the one `retail-banking-app` project, beside
# payments-api-build and mobile-client-build. Those describe how each component
# was built; this one closes the cycle they were building towards.
#
# Version flow: .chainloop.yml carries `projectVersion: <last release>+next`, and
# `attestation init` picks it up whenever no --version is passed, so every build
# and this workflow attest into one in-flight version. Tagging then releases it:
#
#   1. attest with --release, still under the `+next` name;
#   2. rename that version to the tag;
#   3. bump .chainloop.yml to `<tag>+next` via a pull request.
#
# Between the tag and that PR merging, builds still attest under the old `+next`
# name. It is a PR rather than a push so the version in git stays reviewable.
#
# Gates on two things, per .chainloop/contracts/retail-banking-app-release.yaml:
# the compliance requirements the build workflows already produced for this
# version (no scan is re-run here), and the cross-component integration suite,
# which runs below because it belongs to neither component.
#
# It also builds the Payments API container image and publishes it to GHCR, then
# attests the digest, so the artifact that actually ships is part of the release
# attestation rather than a side effect of it. That happens after the integration
# suite has cleared its gate — `test-results` is a material policy, so it is
# evaluated by `attestation add` and a red suite stops the pipeline before
# anything is packaged. The compliance requirements gate even earlier:
# check-compliance-requirement is a builtin that declares no attestation_phases,
# and an empty list means every phase, so it is evaluated at `attestation init`
# as well as at the push. A version missing sast/coverage/mutation therefore
# fails the first job and never reaches the build at all.
#
# Four jobs share ONE attestation via `init --remote-state`, same shape as
# api-build.yml.

name: Release

on:
  push:
    tags: [ 'v*' ]
  # Re-attest a release without moving its tag — also how a release blocked by
  # the gate is retried once a requirement exception has been recorded.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attest, e.g. v2026.9'
        required: true
        type: string

permissions:
  contents: read
  # OIDC token Chainloop uses to identify the org, so init and push need no
  # CHAINLOOP_TOKEN. The version rename does — see that step.
  id-token: write

jobs:
  # Also collects the runner context, so it must run before anything it
  # describes.
  attestation-init:
    name: Open attestation
    runs-on: ubuntu-latest
    outputs:
      attestation-id: ${{ steps.init.outputs.attestation-id }}
      tag: ${{ steps.tag.outputs.tag }}
      current-version: ${{ steps.project_version.outputs.current_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # On a tag push `inputs.version` is empty and ref_name is the tag; on a
      # manual run the input wins.
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::could not resolve a release tag"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      # Captured before anything can rewrite the file: the rename below needs the
      # name the builds actually attested under.
      - name: Read in-flight project version
        id: project_version
        run: |
          current_version="$(awk '/^projectVersion:/ {print $2}' .chainloop.yml)"
          if [ -z "$current_version" ]; then
            echo "::error::no projectVersion in .chainloop.yml"
            exit 1
          fi
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${current_version} as ${{ steps.tag.outputs.tag }}"

      # No --version on purpose: this attestation lands in the same version as
      # the builds rather than opening a fresh one named after the tag.
      # --release promotes that version.
      - name: Initialize attestation
        id: init
        env:
          # Lets the runner-context collector verify the commit and its signature
          # through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without pipefail the pipeline reports jq's status, so a failed init
          # would "succeed" with an empty id and blame the downstream `add`.
          set -o pipefail
          id=$(chainloop attestation init --remote-state --release \
            --project retail-banking-app --workflow release -o json | jq -r .attestationID)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::attestation init returned no attestation id"
            exit 1
          fi
          echo "attestation-id=${id}" >> "$GITHUB_OUTPUT"
          echo "Attestation ${id}"

  # The cross-component integration suite: it asserts the contract between the
  # mobile client and the Payments API, so it belongs to neither component's
  # build and runs here once, against the versions being released.
  #
  # Report-only by design — the `integration` profile sets testFailureIgnore and
  # does not bind failsafe:verify, so a failing test still leaves this job green
  # and the report gets attested. A Maven failure would abort before the evidence
  # could be added, and the gate would never see it. Blocking happens at
  # `attestation push`.
  integration-tests:
    name: Integration tests
    needs: attestation-init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run the cross-component integration suite
        run: ./mvnw -B -P integration verify

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # The whole report directory travels as one material, so a second *IT class
      # needs no change here. Fails loudly when the glob matches nothing, so a
      # suite that produced no report cannot reach the gate unnoticed.
      - name: Package the Failsafe reports
        run: zip -q -j failsafe-reports.zip target/failsafe-reports/*.xml

      - name: Attest integration test report
        run: |
          chainloop attestation add --name integration-report --kind JUNIT_XML \
            --value failsafe-reports.zip --attestation-id "$ATTESTATION_ID"

  # The shippable artifact. api-build.yml attests the JAR on every push to main;
  # the image is built here instead, once, from the tagged source, so its tag is
  # the release tag and its digest lands in the release attestation.
  #
  # Runs after integration-tests so nothing is packaged for a release that cannot
  # ship. That dependency has teeth: the contract's `test-results` gate is
  # evaluated by `attestation add`, not deferred to the push, so a failing suite
  # fails the add step and this job never starts. The Maven run staying green is
  # irrelevant — the gate is what blocks.
  #
  # Note this recompiles the application: the JAR inside the image is a second
  # build of the same commit, not the byte-identical one api-build.yml attested.
  container-image:
    name: Container image
    needs: [ attestation-init, integration-tests ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-api

    permissions:
      contents: read
      id-token: write
      # Pushing to ghcr.io. No registry secret is needed beyond GITHUB_TOKEN.
      packages: write

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/payments-api:${{ needs.attestation-init.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Also writes ~/.docker/config.json, which is how the Chainloop CLI below
      # authenticates when it resolves the digest of this private GHCR image.
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Paketo buildpacks via the Spring Boot plugin, so there is no Dockerfile
      # to keep in sync with the build. `publish=true` pushes straight to GHCR
      # rather than loading into the local daemon first.
      #
      # Tests are skipped on purpose: the unit suite already ran in api-build.yml
      # for this commit, and the integration suite ran — and cleared its gate —
      # in the job this one depends on.
      - name: Build and publish the container image
        run: |
          ./mvnw -B spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName="$IMAGE" \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username='${{ github.actor }}' \
            -Ddocker.publishRegistry.password='${{ secrets.GITHUB_TOKEN }}'

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # Attested by reference, not by upload: the CLI resolves the tag to its
      # immutable digest against the registry, so the evidence points at the
      # exact image even after the tag is moved.
      - name: Attest container image
        run: |
          chainloop attestation add --name container-image --kind CONTAINER_IMAGE \
            --value "$IMAGE" --attestation-id "$ATTESTATION_ID"

  # Closes the attestation and, only if it was accepted, promotes the version.
  # `success()`/`failure()` describe a job's own steps, so upstream results are
  # read from the needs context instead.
  release:
    name: Release attestation
    needs: [ attestation-init, integration-tests, container-image ]
    # Nothing to close if init produced no id, and `reset` would fail on an
    # empty --attestation-id.
    if: always() && needs.attestation-init.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      # For the bump pull request.
      pull-requests: write

    env:
      ATTESTATION_ID: ${{ needs.attestation-init.outputs.attestation-id }}
      RELEASE_TAG: ${{ needs.attestation-init.outputs.tag }}
      CURRENT_VERSION: ${{ needs.attestation-init.outputs.current-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # Where the release is allowed to proceed or not: a policy violation makes
      # this exit non-zero, which is what lets the gate block the pipeline.
      - name: Push attestation
        id: push
        if: needs.integration-tests.result == 'success' && needs.container-image.result == 'success'
        run: chainloop attestation push --attestation-id "$ATTESTATION_ID"

      # A plain control-plane call rather than an attestation, so it
      # authenticates with a token instead of the OIDC identity.
      #
      # Gated on the push having succeeded rather than on step failure: when the
      # push is SKIPPED — the integration job failed — the following steps would
      # otherwise still release a version whose gate never ran.
      - name: Rename project version to the release tag
        if: steps.push.outcome == 'success'
        env:
          CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
        run: |
          chainloop project version update --project retail-banking-app \
            --name "$CURRENT_VERSION" --new-name "$RELEASE_TAG"

      # Last, so a failure here leaves a complete release in Chainloop and only
      # the next cycle unopened.
      - name: Bump project version for the next cycle
        if: steps.push.outcome == 'success'
        run: .github/workflows/utils/bump-project-version.sh "$RELEASE_TAG"

      - name: Open the bump pull request
        if: steps.push.outcome == 'success'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore(chainloop): bump projectVersion to ${{ env.RELEASE_TAG }}+next"
          signoff: true
          base: main
          branch: chainloop/bump-project-version
          title: "chore(chainloop): open the cycle after ${{ env.RELEASE_TAG }}"
          body: |
            `${{ env.RELEASE_TAG }}` is released and its project version
            renamed. This points `.chainloop.yml` at the next cycle, so builds
            of both components attest under `${{ env.RELEASE_TAG }}+next`.

            Until this merges, builds keep attesting under
            `${{ env.CURRENT_VERSION }}`, which is now the released version.
          labels: automated

      # Catch-all rather than one step per outcome: a needs result can also be
      # `skipped`, which no failure/cancelled condition matches, leaving the
      # remote attestation open forever. A blocked release lands here too — the
      # gate failed the push, so the rename and the bump PR never ran and this
      # closes the attestation, leaving nothing half-released.
      - name: Reset attestation if it was not pushed
        if: always() && steps.push.outcome != 'success'
        run: |
          trigger=failure
          if [ "${{ needs.integration-tests.result }}" = "cancelled" ] \
            || [ "${{ needs.container-image.result }}" = "cancelled" ]; then
            trigger=cancellation
          fi
          chainloop attestation reset --trigger "$trigger" --attestation-id "$ATTESTATION_ID"
