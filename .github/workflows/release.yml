# Release pipeline for the retail-banking-app product.
#
# This is the third workflow of the one `retail-banking-app` project, beside
# payments-api-build and mobile-client-build. Those two describe how each
# component was built; this one closes the cycle they were building towards.
#
# How the version flows
# ---------------------
# .chainloop.yml carries `projectVersion: <last release>+next`, and
# `chainloop attestation init` picks it up whenever no --version is passed. So
# every build of either component attests into that one in-flight version, and
# so does this workflow — no pipeline names a version anywhere.
#
# Tagging is what turns that accumulated version into a release:
#
#   1. attest with --release, still under the `+next` name, so the release
#      attestation joins the same version the builds landed in;
#   2. rename that version to the tag, which is what makes it read as v2026.9
#      rather than v2026.8+next;
#   3. bump .chainloop.yml to `<tag>+next` via a pull request, opening the next
#      cycle.
#
# Between the tag and that pull request merging, builds still attest under the
# old `+next` name — the same gap the process in chainloop-dev/chainloop has.
# It closes as soon as the bump lands, and it is why the bump is a PR rather
# than a push: the version in git stays reviewable.
#
# The attestation itself currently carries nothing but its runner context, per
# .chainloop/contracts/retail-banking-app-release.yaml — see the comment there
# for what is expected to land and what is blocking it.
#
# Single job, so the attestation state stays local. The --remote-state
# machinery in api-build.yml exists only because that pipeline fans evidence
# out across three jobs; there is nothing to share here.

name: Release

on:
  push:
    tags: [ 'v*' ]
  # Cutting a tag is the normal path. Manual runs exist to re-attest a release
  # without moving or recreating its tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attest, e.g. v2026.9'
        required: true
        type: string

permissions:
  contents: read
  # Lets the workflow request an OIDC token that Chainloop uses to identify the
  # org, so attestation init and push need no CHAINLOOP_TOKEN. The version
  # rename below does — see that step.
  id-token: write

jobs:
  release:
    name: Release attestation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      # Both for the bump pull request.
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # On a tag push `inputs.version` is empty and ref_name is the tag; on a
      # manual run the input wins.
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::could not resolve a release tag"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      # Captured before anything can rewrite the file, because the rename below
      # needs the name the builds actually attested under.
      - name: Read in-flight project version
        id: project_version
        run: |
          current_version="$(awk '/^projectVersion:/ {print $2}' .chainloop.yml)"
          if [ -z "$current_version" ]; then
            echo "::error::no projectVersion in .chainloop.yml"
            exit 1
          fi
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${current_version} as ${{ steps.tag.outputs.tag }}"

      # No --version on purpose: it resolves to projectVersion from
      # .chainloop.yml, which is the whole point — this attestation lands in the
      # same version as the builds rather than opening a fresh one named after
      # the tag. --release is what promotes that version.
      - name: Initialize attestation
        id: init
        env:
          # Used by the runner-context collector to verify the commit and its
          # signature through the GitHub API. Unauthenticated calls get rate
          # limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chainloop attestation init \
            --project retail-banking-app --workflow release --release

      - name: Push attestation
        id: push
        run: chainloop attestation push

      # Only now, with the release attestation in, does the version take the
      # tag's name. Unlike init and push this is a plain control-plane call
      # rather than an attestation, so it authenticates with a token instead of
      # the OIDC identity.
      - name: Rename project version to the release tag
        env:
          CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
          CURRENT_VERSION: ${{ steps.project_version.outputs.current_version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chainloop project version update --project retail-banking-app \
            --name "$CURRENT_VERSION" --new-name "$RELEASE_TAG"

      # Last, so a failure here leaves a complete release in Chainloop and only
      # the next cycle unopened — recoverable by re-running or editing the file
      # by hand.
      - name: Bump project version for the next cycle
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: .github/workflows/utils/bump-project-version.sh "$RELEASE_TAG"

      - name: Open the bump pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore(chainloop): bump projectVersion to ${{ steps.tag.outputs.tag }}+next"
          signoff: true
          base: main
          branch: chainloop/bump-project-version
          title: "chore(chainloop): open the cycle after ${{ steps.tag.outputs.tag }}"
          body: |
            `${{ steps.tag.outputs.tag }}` is released and its project version
            renamed. This points `.chainloop.yml` at the next cycle, so builds
            of both components attest under
            `${{ steps.tag.outputs.tag }}+next`.

            Until this merges, builds keep attesting under
            `${{ steps.project_version.outputs.current_version }}`, which is now
            the released version.
          labels: automated

      # Both resets are gated on init having succeeded. A bare failure()/cancelled()
      # also fires when checkout or the CLI install failed — cases with no
      # attestation to reset, and in the install case no `chainloop` binary
      # either, so the reset would exit non-zero on top of the real failure and
      # bury it. Also gated on the push not having landed: once it has, the
      # attestation is closed and a reset would fail against nothing.
      - name: Reset attestation on failure
        if: failure() && steps.init.outcome == 'success' && steps.push.outcome != 'success'
        run: chainloop attestation reset

      - name: Reset attestation on cancellation
        if: cancelled() && steps.init.outcome == 'success' && steps.push.outcome != 'success'
        run: chainloop attestation reset --trigger cancellation
