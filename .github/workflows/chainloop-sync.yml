# GitOps sync for .chainloop/: the workflow contracts in contracts/ and the
# org-scoped custom policies in policies/ they reference by name.
#
# Git is the source of truth — this only ever pushes repo -> server, so an edit
# made in the Chainloop web UI is reverted by the next run rather than merged.
#
# `chainloop apply` rather than `workflow contract update`: it accepts
# `kind: Contract`, takes the whole directory in one invocation, and reports
# `unchanged` when content matches, so the nightly run does not churn revisions.
name: Chainloop Contract Sync

on:
  pull_request:
    paths:
      - '.chainloop/**'
      - '.github/workflows/chainloop-sync.yml'
  push:
    branches: [ main ]
    paths:
      - '.chainloop/**'
      - '.github/workflows/chainloop-sync.yml'
  # Reasserts git over any UI edit, and catches a contract that stopped
  # validating because a policy it references changed server-side.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Has to be a server-side dry-run: `--offline` validates cross-references
  # against the batch contents only, and every policy these contracts reference
  # is a builtin living on the server. That needs the token, so the job cannot
  # run on a fork PR — skipped there rather than failing.
  validate:
    name: Validate resources
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # The CLI reads CHAINLOOP_TOKEN; the secret is named for what it may do.
      - name: Dry-run apply
        env:
          CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_SYNC_CONTRACTS_TOKEN }}
        run: chainloop apply -f .chainloop/ --dry-run

  apply:
    name: Apply resources
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chainloop
        run: curl -sfL https://api.app.chainloop.dev/cli/install.sh | bash -s

      # No --org: an organization API token is already scoped to its org.
      - name: Apply resources
        env:
          CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_SYNC_CONTRACTS_TOKEN }}
        run: chainloop apply -f .chainloop/
