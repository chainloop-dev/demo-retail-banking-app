# Contract for the `payments-api-build` workflow (.github/workflows/api-build.yml).
# Every material is produced unconditionally by that workflow, so none is optional.
apiVersion: chainloop.dev/v1
kind: Contract
metadata:
  name: retail-banking-app-payments-api-build
spec:
  materials:
    - name: app-binary
      type: ARTIFACT
    - name: coverage-report
      type: JACOCO_XML
    # Produced by `chainloop transform sonarqube`; SonarQube's own output never
    # leaves their server.
    - name: sast-report
      type: SARIF
    - name: mutation-report
      type: PITEST_XML

  policies:
    attestation:
      - ref: source-commit

      # Both ship a `kind: ATTESTATION` rego, so they must be attached here.
      # Under `materials` they would match nothing and never evaluate.
      - ref: test-coverage-scan-present
      - ref: mutation-scan-present

    materials:
      - ref: code-coverage
        with:
          counter: INSTRUCTION
          threshold: "80"

      # test_strength excludes NO_COVERAGE mutants, so it does not re-penalise
      # the reach gaps code-coverage already gates.
      - ref: mutation-score
        with:
          metric: test_strength
          threshold: "80"

  policyGroups:
    - ref: sast
    # Java only: the Sonar transform enriches findings with CWE IDs. Deliberately
    # absent from the mobile contract, where Oversecured findings carry none.
    - ref: cwes

  runner:
    type: GITHUB_ACTION
