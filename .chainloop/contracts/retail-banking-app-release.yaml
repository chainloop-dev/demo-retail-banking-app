# Contract for the `release` workflow (.github/workflows/release.yml).
#
# The release gates on the compliance requirements the two build workflows
# already produced for this project version — check-compliance-requirement
# resolves them for `predicate.metadata.projectVersion`, the `+next` name both
# builds attested under — plus the one piece of evidence that belongs to neither
# component: the cross-component integration test report.
#
# The gate is red today by design. The intended path out is a requirement
# exception recorded in Chainloop, which the policy skips, not a weaker contract.
apiVersion: chainloop.dev/v1
kind: Contract
metadata:
  name: retail-banking-app-release
spec:
  materials:
    # Failsafe's report directory, zipped: the JUNIT_XML ingester reads a .zip,
    # so one material covers every *IT class.
    - name: integration-report
      type: JUNIT_XML

  policies:
    materials:
      # Custom policy in .chainloop/policies/ — no built-in reads JUNIT_XML test
      # results. `max_failures` is left at its default of 0.
      - ref: test-results
        gate: true

    attestation:
      - ref: source-commit

      # One attachment rather than three: the policy reports one violation per
      # failing requirement, so a blocked release names all of them. Matches on
      # `name`, not on the display name.
      - ref: check-compliance-requirement
        with:
          framework_name: chainloop-best-practices
          requirement_name: sast-analysis,code-coverage,mutation-score
        gate: true

  runner:
    type: GITHUB_ACTION
