# Contract for the `mobile-client-build` workflow (.github/workflows/mobile-build.yml).
# See mobile-client/README.md: the APK is a pre-built stand-in and the scan runs
# out of band, but the attestation and the report are real.
apiVersion: chainloop.dev/v1
kind: Contract
metadata:
  name: retail-banking-app-mobile-client-build
spec:
  materials:
    - name: app-binary
      type: ARTIFACT
    # Fetched live from Oversecured's API on every run.
    - name: sast-report
      type: OVERSECURED_JSON

  policies:
    attestation:
      - ref: source-commit

  policyGroups:
    # Same group the Java contract uses: one policy, two report formats, one
    # findings model.
    - ref: sast
    # No `cwes` here — Oversecured findings carry neither CWE nor CVE, so the
    # group would never populate for this component.

  runner:
    type: GITHUB_ACTION
